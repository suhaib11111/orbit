html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 "Noto Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
html[lang="en"] body{font-family:"Plus Jakarta Sans","Noto Sans Arabic",system-ui,sans-serif}
.num,.big,.stat b,.cat-v,.day-v,.row-a{font-variant-numeric:tabular-nums}
html[lang="en"] .big,html[lang="en"] .stat b,html[lang="en"] h1{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.05rem "Plus Jakarta Sans",sans-serif;direction:ltr}
.brand svg{width:30px;height:30px}
.lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 14px;min-height:44px;font:700 .9rem inherit;font-family:"Noto Sans Arabic","Plus Jakarta Sans",sans-serif;cursor:pointer;box-shadow:0 2px 0 var(--line-d)}
.lang:active{transform:translateY(2px);box-shadow:none}
h1{font-size:1.65rem;line-height:1.25;margin:4px 0 2px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-weight:600;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:12px;box-shadow:0 3px 0 var(--line-d)}
.hero{background:var(--ok);color:#fff;border:0;box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 65%,#000)}
@media (prefers-color-scheme: dark){.hero{color:#0B2A30}}
.hero small{display:block;font-weight:700;opacity:.92}
.big{display:block;font-weight:800;font-size:clamp(2.1rem,10vw,2.9rem);line-height:1.1;margin:6px 0 2px;letter-spacing:-.01em}
.big em,.unit{font-style:normal;font-size:.45em;font-weight:700;opacity:.85}
.bar{height:12px;border-radius:12px;background:rgba(255,255,255,.3);overflow:hidden;margin:12px 0 8px}
.bar span{display:block;height:100%;border-radius:12px;background:#fff}
@media (prefers-color-scheme: dark){.bar{background:rgba(11,42,48,.25)}.bar span{background:#0B2A30}}
.hero .of{font-weight:600;opacity:.92}
.cmp{display:inline-block;margin-top:10px;font-weight:800;font-size:.9rem;border-radius:999px;padding:3px 12px;background:rgba(255,255,255,.22)}
@media (prefers-color-scheme: dark){.cmp{background:rgba(11,42,48,.18)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 3px 0 var(--line-d)}
.stat b{display:block;font-weight:800;font-size:1.2rem;line-height:1.2;word-break:break-word}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:.8rem;line-height:1.3;margin-top:2px}
.stat .d{display:block;font-size:.74rem;font-weight:800;margin-top:4px;line-height:1.3}
.stat .vs{display:block;font-weight:600;color:var(--muted)}
.bad{color:var(--warm-t)} .good{color:var(--ok-t)} .same{color:var(--muted)}
h2{font-size:1.1rem;margin:0 0 10px;font-weight:800}
.callout{display:flex;align-items:center;gap:12px}
.dot{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800}
.callout b{display:block;font-size:1.05rem}
.callout small{display:block;color:var(--muted);font-weight:600}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat-n{font-weight:700}
.cat-v{font-weight:800;text-align:end}
.track{grid-column:1 / -1;height:9px;border-radius:9px;background:var(--track);overflow:hidden}
.track span{display:block;height:100%;border-radius:9px}
.cat-p{grid-column:1 / -1;color:var(--muted);font-size:.8rem;font-weight:700}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:6px}
.chart i{flex:1;min-width:0;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--ok) 45%,var(--track));min-height:3px}
.chart i.z{background:var(--track)}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;font-weight:700;margin-top:6px}
.line{margin:10px 0 0;color:var(--muted);font-weight:600}
.line b{color:var(--ink)}
details{margin-top:12px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-weight:800;font-size:1.05rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";font-weight:800;color:var(--muted)}
details[open] summary::after{content:"－"}
.day{margin-top:12px}
.day-h{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;font-size:.85rem;padding-bottom:4px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row-n{min-width:0}
.row-n small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.row-a{flex:none;font-weight:800}
.foot{color:var(--muted);font-size:.82rem;font-weight:600;text-align:center;margin-top:22px;line-height:1.6}
.err{text-align:center;padding:40px 10px}
.err b{display:block;font-size:1.2rem;margin-bottom:6px}
</style>

  document.title='Orbit'; app.innerHTML='<div class="err"><b>'+t(k[0])+'</b>'+(k[1]?t(k[1]):'')+'</div>'; }
function expiredDay(x){ if(!x) return false; var end=String(x).length===10?new Date(x+'T23:59:59'):new Date(x); return Date.now()>end.getTime(); }
addEventListener('hashchange',function(){ location.reload(); });
var h=location.hash.slice(1), raw='';
if(/^r=/.test(h)){
  var q={}; h.split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
  RID=/^[0-9a-f-]{36}$/i.test(q.r||'')?q.r:null; L=T[q.l]?q.l:'ku'; setLang(L);
  if(!RID){ fail('broken'); return; }
  fetch(SB_URL+'/rest/v1/rpc/get_report',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_id:RID})})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(res){ if(!res||res.status!=='ok'){ fail(res&&res.status||'broken'); return; }
      var d=res.data; if(!d||!d.m||!Array.isArray(d.d)) throw new Error('shape');
      if(!q.l&&T[res.lang]&&res.lang!==L) setLang(res.lang);
      D=d; D.k=D.k||[]; D.x=res.expires_at; render(); })
    .catch(function(e){ fail(navigator.onLine===false?'offline':(e&&e.message==='shape'?'broken':'offline')); });
} else {
  var dot=h.indexOf('.'); raw=dot>0?h.slice(dot+1):'';
  L=T[h.slice(0,dot)]?h.slice(0,dot):'ku'; setLang(L);
  if(!raw){ fail('broken'); return; }
  unpack(raw).then(function(d){ if(!d||!d.m||!Array.isArray(d.d)) throw new Error('shape'); if(expiredDay(d.x)){ fail('expired'); return; } D=d; D.k=D.k||[]; render(); }).catch(function(e){ fail(e&&e.message==='old'?'old':'broken'); });
}
})();
