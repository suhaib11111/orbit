body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 "Noto Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  document.onclick=close; document.onkeydown=function(e){ if(e.key==='Escape'){ close(); b.focus(); } };
}
function brand(){ return '<div class="top"><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="9" fill="#17807C"/><ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#7FD1C3" stroke-width="2.6" transform="rotate(-25 20 20)"/><circle cx="11.4" cy="29.6" r="3.2" fill="#FF8F5A"/></svg>Orbit</div>'+langMenu()+'</div>'; }
function render(){
  var exp=expiresAt(); if(exp&&Date.now()>exp.getTime()){ fail('expired'); return; }

  var y=+D.m.slice(0,4), mo=+D.m.slice(5,7)-1, dim=D.d.length, endDay=D.at&&D.at.slice(0,7)===D.m?+D.at.slice(8,10):dim;
  var period=L==='ku'?digits(1)+' – '+digits(endDay)+'ی '+mName(mo)+' '+digits(y):mName(mo)+' 1 – '+endDay+', '+y;
  var p=D.p, pct=D.b?Math.round(D.sp/D.b*100):0, rest=(D.b||0)-D.sp, rows=(D.e||[]).map(function(r){ return {d:r[0],c:r[1],a:r[2],x:r[3]||'',n:r[4]||1,tm:r[5]||''}; });

  function delta(curv,prev,goodUp){ if(!p||!prev) return ''; var d=Math.round((curv-prev)/prev*100); if(!d) return ''; return '<span class="sub '+((d>0)===goodUp?'good':'bad')+'">'+(d>0?'▲ ':'▼ ')+digits(Math.abs(d)+'%')+' · '+t('vsLast')+'</span>'; }
  var maxDay=0, maxV=0, used=0; D.d.forEach(function(v,i){ if(v>maxV){ maxV=v; maxDay=i+1; } if(v>0) used++; });
  var html=brand()+'<h1>'+title+'</h1><p class="period">'+period+'</p><div class="chips">';
  if(D.sa) html+='<span class="chip">'+t('sharedOn')+'<b>'+stamp(D.sa)+'</b></span>';
  if(exp) html+='<span class="chip live"><i aria-hidden="true"></i>'+t('worksUntil')+'<b>'+stamp(exp.toISOString())+'</b> · <span id="leftTxt">'+leftTxt(exp-Date.now())+'</span></span>';
  html+='</div>';
  html+='<section class="card hero"><small>'+t('spent')+'</small><span class="big">'+money(D.sp)+'</span>'+
    (D.b?'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.min(100,pct)+'"><span style="width:'+Math.min(100,pct)+'%"></span></div><div class="hero-row"><span>'+(L==='ku'?digits(pct+'%')+' '+t('ofBudget')+moneyTxt(D.b):digits(pct)+'% of a '+moneyTxt(D.b)+' budget')+'</span><span>'+moneyTxt(Math.abs(rest))+' '+(rest>=0?t('leftBudget'):t('overBudget'))+'</span></div>':'')+cmp+'</section>';
  var goal=D.g||0, gp=goal?Math.round(Math.max(0,D.s)/goal*100):0;
  html+='<div class="grid">'+
    '<div class="stat t1"><small>'+t('moneyIn')+'</small><b>'+moneyTxt(D.i)+'</b>'+delta(D.i,p&&p[1],true)+'</div>'+
    '<div class="stat t2"><small>'+t('saved')+'</small><b>'+moneyTxt(Math.max(0,D.s))+'</b>'+(goal?'<span class="sub">'+digits(gp+'%')+' '+t('savedGoal')+moneyTxt(goal)+'</span>':delta(D.s,p&&p[2],true))+'</div>'+
    '<div class="stat t3"><small>'+t('avg')+'</small><b>'+moneyTxt(D.a)+'</b></div>'+
    '<div class="stat t4"><small>'+t('count')+'</small><b>'+num(rows.length)+'</b></div>'+
    '<div class="stat t5"><small>'+t('bigDay')+'</small><b>'+(maxV?moneyTxt(maxV):'—')+'</b>'+(maxV?'<span class="sub">'+dateTxt(new Date(y,mo,maxDay),true)+'</span>':'')+'</div>'+
    '<div class="stat t6"><small>'+t('daysUsed')+'</small><b>'+num(used)+'</b><span class="sub">'+(L==='ku'?digits(used)+t('ofDays')+digits(endDay):used+t('ofDays')+endDay+' days')+'</span></div></div>';
  if(D.k&&D.k.length){
    var top=D.k[0], tp=D.sp?Math.round(top[3]/D.sp*100):0, cnt={}; rows.forEach(function(r){ cnt[r.c]=(cnt[r.c]||0)+1; });
    html+='<section class="card callout"><span class="dot" style="background:'+esc(top[2])+'">'+digits(tp+'%')+'</span><div><small>'+t('biggest')+'</small><b>'+esc(catName(top[0],top[1]))+'</b><small>'+moneyTxt(top[3])+' · '+digits(tp+'%')+t('ofAll')+'</small></div></section>';
    var mx=Math.max.apply(null,D.k.map(function(x){ return x[3]; }))||1;
    html+='<section class="card">'+h2('chart','#9B7BE0',t('byCat'))+D.k.map(function(x){ var cp=D.sp?Math.round(x[3]/D.sp*100):0;
      return '<div class="cat"><div class="cat-h"><span><span class="cdot" style="background:'+esc(x[2])+'"></span>'+esc(catName(x[0],x[1]))+'</span><span class="num">'+moneyTxt(x[3])+'</span></div><div class="track"><span style="width:'+(x[3]/mx*100)+'%;background:'+esc(x[2])+'"></span></div><div class="cat-s"><span>'+digits(cp+'%')+'</span><span>'+num(cnt[x[0]]||0)+t('items')+'</span></div></div>'; }).join('')+'</section>';
  }
  var dmx=Math.max.apply(null,D.d)||1, weeks=[];
  for(var w=0;w*7<dim;w++){ var s=0; for(var i=w*7;i<Math.min(dim,w*7+7);i++) s+=D.d[i]; weeks.push(s); }
  html+='<section class="card">'+h2('cal','#3E8ED0',t('perDay'))+'<div class="chart" role="img" aria-label="'+t('perDay')+'">'+D.d.map(function(v,i){ return '<i class="'+(v?(i+1===maxDay?'max':''):'z')+'" style="height:'+Math.max(3,v/dmx*100)+'%" title="'+dateTxt(new Date(y,mo,i+1),false)+': '+moneyTxt(v)+'"></i>'; }).join('')+'</div>'+
    '<div class="axis"><span>'+digits(1)+'</span><span>'+digits(8)+'</span><span>'+digits(15)+'</span><span>'+digits(22)+'</span><span>'+digits(dim)+'</span></div>'+
    (maxV?'<p class="note">'+t('highest')+'<b>'+dateTxt(new Date(y,mo,maxDay),true)+' · '+moneyTxt(maxV)+'</b></p>':'')+
    '<div class="weeks">'+weeks.map(function(s,i){ return '<div class="wk"><small>'+t('weekN')+digits(i+1)+'</small><b class="num">'+moneyTxt(s)+'</b></div>'; }).join('')+'</div></section>';
  var tr=D.t||[0,0,0,0];
  if(tr[0]) html+='<section class="card">'+h2('bus','#FF8F5A',t('college'))+'<div class="grid" style="margin-top:0;grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat t1"><b>'+num(tr[0])+'</b><small>'+t('trips')+'</small></div><div class="stat t2"><b>'+num(tr[1])+'</b><small>'+t('shared')+'</small></div><div class="stat t5"><b>'+num(tr[2])+'</b><small>'+t('sharedSaved')+'</small></div></div>'+(tr[3]?'<p class="note">'+t('classDay')+'<b>'+moneyTxt(tr[3])+'</b></p>':'')+'</section>';
  if(rows.length){
    var groups={}, order=[]; rows.slice().reverse().forEach(function(r){ if(!groups[r.d]){ groups[r.d]=[]; order.push(r.d); } groups[r.d].push(r); });
    var limit=showAll?order.length:Math.min(order.length,7), kc={}; (D.k||[]).forEach(function(x){ kc[x[0]]=x[2]; });
    html+='<section class="card">'+h2('list','#2E7D5B',t('all')+' · '+num(rows.length))+order.slice(0,limit).map(function(day){ var list=groups[day], tot=list.reduce(function(a,r){ return a+r.a; },0);
      return '<div class="day"><div class="day-h"><span>'+dateTxt(new Date(y,mo,day),true)+'</span><span class="num">'+moneyTxt(tot)+'</span></div>'+list.map(function(r){
        var name, sub=catName(r.c);

        else name=r.x?esc(r.x):catName(r.c);

        var tm=''; if(r.tm){ var a=r.tm.split(':'); tm=clock(new Date(y,mo,day,+a[0],+a[1])); }

      (limit<order.length?'<button type="button" class="more" id="showAll">'+t('showAll')+' · '+num(order.length)+' '+t('dy')+'</button>':'')+'</section>';

  app.innerHTML=html; wireLang();

  clearInterval(tick); if(exp) tick=setInterval(function(){ var ms=exp-Date.now(); if(ms<=0){ clearInterval(tick); fail('expired'); return; } var e=document.getElementById('leftTxt'); if(e) e.textContent=leftTxt(ms); },15000);
}
function fail(key){
  var k={old:['oldBrowser',''],expired:['expired','expired2'],stopped:['stopped','stopped2'],offline:['offline','offline2']}[key]||['broken','broken2'];
  var icon={expired:'⏱️',stopped:'⏹️',offline:'📶'}[key]||'🔗';
  document.title='Orbit'; clearInterval(tick);
  app.innerHTML=brand()+'<div class="err"><div class="ico" aria-hidden="true">'+icon+'</div><b>'+t(k[0])+'</b><p>'+(k[1]?t(k[1]):'')+'</p></div>'; wireLang();
}
addEventListener('hashchange',function(){ location.reload(); });
var h=location.hash.slice(1);
if(/^r=/.test(h)){
  var q={}; h.split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
  RID=/^[0-9a-f-]{36}$/i.test(q.r||'')?q.r:null; setLang(T[q.l]?q.l:'ku');

    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })

      if(!q.l&&T[res.lang]&&res.lang!==L) setLang(res.lang);

    .catch(function(e){ fail(e&&e.message==='shape'?'broken':'offline'); });
} else {
  var dot=h.indexOf('.'); RAW=dot>0?h.slice(dot+1):''; setLang(T[h.slice(0,dot)]?h.slice(0,dot):'ku');
  if(!RAW){ fail('broken'); return; }
